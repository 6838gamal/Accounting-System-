{% extends "base.html" %}
{% block title %}سند مصروف جديد{% endblock %}
{% block page_title %}سند مصروف جديد{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-cash-stack me-2"></i>سند مصروف جديد</h1>
    <a href="/expense-vouchers" class="btn btn-outline-secondary"><i class="bi bi-arrow-right me-1"></i>رجوع</a>
</div>

<div class="card" style="max-width:720px;">
    <div class="card-body">
        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}
        <form method="post" action="/expense-vouchers/new">
    {{ csrf_input|safe }}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">رقم السند <span class="text-danger">*</span></label>
                    <input type="text" name="voucher_number" class="form-control" required
                           value="{{ suggested_number }}" placeholder="EV-2026-0001">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">التاريخ <span class="text-danger">*</span></label>
                    <input type="date" name="voucher_date" class="form-control" required value="{{ today }}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">المستفيد <span class="text-danger">*</span></label>
                    <input type="text" name="payee" class="form-control" required placeholder="اسم المستفيد أو الجهة المدفوع لها">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">المبلغ <span class="text-danger">*</span></label>
                    <input type="text" inputmode="decimal" name="amount" class="form-control" required placeholder="0.00" pattern="[0-9]*\.?[0-9]*" autocomplete="off">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">طريقة الدفع</label>
                    <select name="method" class="form-select">
                        {% for m in methods %}
                        <option value="{{ m.value }}">{{ method_labels.get(m.value, m.value) }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">الفئة</label>
                    <select name="category" class="form-select">
                        <option value="">-- اختر الفئة --</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">رقم المرجع / الشيك</label>
                    <input type="text" name="reference" class="form-control" placeholder="اختياري">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">البيان</label>
                    <textarea name="description" class="form-control" rows="2" placeholder="وصف مختصر للمصروف"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">ملاحظات</label>
                    <textarea name="notes" class="form-control" rows="2" placeholder="ملاحظات إضافية (اختياري)"></textarea>
                </div>
            </div>
            <hr class="my-4">
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save me-1"></i>حفظ السند
                </button>
                <a href="/expense-vouchers" class="btn btn-outline-secondary">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
