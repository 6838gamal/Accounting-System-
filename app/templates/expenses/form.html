{% extends "base.html" %}
{% block title %}مصروف جديد{% endblock %}
{% block page_title %}مصروف جديد{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-wallet2 me-2"></i>مصروف جديد</h1>
    <a href="/expenses" class="btn btn-outline-secondary"><i class="bi bi-arrow-right me-1"></i>رجوع</a>
</div>
<div class="card">
    <div class="card-body">
        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}
        <form method="post" action="/expenses/new">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">العنوان <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">الفئة <span class="text-danger">*</span></label>
                    <select name="category" class="form-select" required>
                        {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">المبلغ <span class="text-danger">*</span></label>
                    <input type="number" name="amount" class="form-control" step="0.01" min="0" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">التاريخ <span class="text-danger">*</span></label>
                    <input type="date" name="expense_date" class="form-control" required>
                </div>
                <div class="col-12">
                    <label class="form-label">الوصف</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>حفظ</button>
                <a href="/expenses" class="btn btn-outline-secondary">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.querySelector('input[name="expense_date"]').value = new Date().toISOString().split('T')[0];
</script>
{% endblock %}
