{% extends "base.html" %}
{% block title %}الإعدادات{% endblock %}
{% block page_title %}إعدادات النظام{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="bi bi-gear me-2"></i>إعدادات النظام</h1>
</div>

{% if saved %}
<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>تم حفظ الإعدادات بنجاح</div>
{% endif %}

<form method="post" action="/settings">
    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card mb-3">
                <div class="card-header"><i class="bi bi-building me-2"></i>بيانات الشركة</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">اسم الشركة</label>
                        <input type="text" name="company_name" class="form-control" value="{{ settings.get('company_name', '') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">العنوان</label>
                        <textarea name="company_address" class="form-control" rows="2">{{ settings.get('company_address', '') }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">رقم الهاتف</label>
                        <input type="text" name="company_phone" class="form-control" value="{{ settings.get('company_phone', '') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">البريد الإلكتروني</label>
                        <input type="email" name="company_email" class="form-control" value="{{ settings.get('company_email', '') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الرقم الضريبي</label>
                        <input type="text" name="company_tax_number" class="form-control" value="{{ settings.get('company_tax_number', '') }}">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card mb-3">
                <div class="card-header"><i class="bi bi-currency-exchange me-2"></i>الإعدادات المالية</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">نسبة الضريبة الافتراضية (%)</label>
                        <input type="number" name="default_tax_rate" class="form-control" value="{{ settings.get('default_tax_rate', '15') }}" min="0" max="100" step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">رمز العملة</label>
                        <input type="text" name="currency" class="form-control" value="{{ settings.get('currency', 'SAR') }}" maxlength="10">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">اسم العملة</label>
                        <input type="text" name="currency_name" class="form-control" value="{{ settings.get('currency_name', 'ريال سعودي') }}">
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><i class="bi bi-hash me-2"></i>الترقيم التلقائي</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">بادئة الفاتورة</label>
                        <input type="text" name="invoice_prefix" class="form-control" value="{{ settings.get('invoice_prefix', 'INV') }}" maxlength="10">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">بادئة عرض السعر</label>
                        <input type="text" name="quote_prefix" class="form-control" value="{{ settings.get('quote_prefix', 'QT') }}" maxlength="10">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">بادئة العقد</label>
                        <input type="text" name="contract_prefix" class="form-control" value="{{ settings.get('contract_prefix', 'CNT') }}" maxlength="10">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary px-5">
            <i class="bi bi-check-lg me-1"></i>حفظ الإعدادات
        </button>
    </div>
</form>
{% endblock %}
